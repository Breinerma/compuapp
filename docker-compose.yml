services:
  # Mismo esquema de red que ECS/awsvpc: los tres comparten localhost.
  nginx:
    image: naturalens-web:latest
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    ports:
      - '80:80'
  db:
    image: naturalens-db:latest
    build: ./db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: naturalens
      MYSQL_USER: naturalens
      MYSQL_PASSWORD: JCMMCMAPbmamyma
      MYSQL_ROOT_PASSWORD: jcmmcmmapBMAMYMA
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u"$$MYSQL_USER" -D "$$MYSQL_DATABASE" -e "SELECT 1"']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    network_mode: service:nginx
  api:
    image: naturalens-api:latest
    build: ./api
    restart: unless-stopped
    environment:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: naturalens
      DB_PASSWORD: JCMMCMAPbmamyma
      DB_NAME: naturalens
      COOKIE_SECURE: 'false'
      UPLOAD_DIR: /app/uploads
      TF_CPP_MIN_LOG_LEVEL: '2'
    volumes:
      - photo_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 90s
    network_mode: service:nginx
volumes:
  mysql_data:
  photo_data:
